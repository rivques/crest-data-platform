services:
  db:
    image: postgres:16-alpine
    container_name: crest-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-crest}
      POSTGRES_USER: ${DB_USER:-crest}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-crest_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crest -d crest"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: crest-web
    command: >
      sh -c "python manage.py makemigrations users &&
             python manage.py makemigrations experiments &&
             python manage.py makemigrations sensors &&
             python manage.py makemigrations ingest &&
             python manage.py makemigrations data &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DB_NAME=${DB_NAME:-crest}
      - DB_USER=${DB_USER:-crest}
      - DB_PASSWORD=${DB_PASSWORD:-crest_dev_password}
      - DB_HOST=db
      - DB_PORT=5432
      - ALLOWED_HOSTS=localhost,127.0.0.1,web
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: crest-frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Preserve node_modules from container
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    container_name: crest-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - DB_NAME=${DB_NAME:-crest}
      - DB_USER=${DB_USER:-crest}
      - DB_PASSWORD=${DB_PASSWORD:-crest_dev_password}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3001:3000"
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
  grafana_data:
