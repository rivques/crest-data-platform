services:
  db:
    image: postgres:16-alpine
    container_name: crest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: crest-web
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn --bind 0.0.0.0:8000 --workers 2 config.wsgi:application"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: "5432"
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-INFO}
      MEDIA_ROOT: /app/media
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crest-frontend
    restart: unless-stopped
    depends_on:
      - web

  grafana:
    image: grafana/grafana:latest
    container_name: crest-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Read-only dashboards without auth, with an option to sign in
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      # Serve Grafana behind the reverse proxy at /grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - db

  certbot-init:
    image: alpine:3.20
    container_name: crest-certbot-init
    restart: "no"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - letsencrypt:/etc/letsencrypt
    command: >
      sh -c "
        set -eu;
        apk add --no-cache openssl;
        CERT_DIR=\"/etc/letsencrypt/live/$${DOMAIN}\";
        if [ -s \"$${CERT_DIR}/fullchain.pem\" ] && [ -s \"$${CERT_DIR}/privkey.pem\" ]; then
          echo \"Certificate already exists for $${DOMAIN}; skipping dummy cert.\";
          exit 0;
        fi;
        echo \"Creating dummy certificate for $${DOMAIN}...\";
        mkdir -p \"$${CERT_DIR}\";
        openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
          -keyout \"$${CERT_DIR}/privkey.pem\" \
          -out \"$${CERT_DIR}/fullchain.pem\" \
          -subj \"/CN=$${DOMAIN}\";
      "

  nginx:
    image: nginx:1.27-alpine
    container_name: crest-nginx
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      DOMAINS: ${DOMAINS}
    ports:
      - "8002:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
      - static_data:/static:ro
      - media_data:/media:ro
    depends_on:
      - certbot-init
      - web
      - frontend

  certbot:
    image: certbot/certbot:latest
    container_name: crest-certbot
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    command: >
      sh -c "
        trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done
      "

volumes:
  postgres_data:
  media_data:
  static_data:
  grafana_data:
  letsencrypt:
  certbot_www:
